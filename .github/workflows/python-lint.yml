name: Python Lint & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'dashboard/**'
      - 'transport/**'
      - 'tests/python/**'
      - 'scripts/*.py'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'dashboard/**'
      - 'transport/**'
      - 'tests/python/**'
      - 'scripts/*.py'

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flake8 black pytest

      - name: Black format check
        run: black --check --line-length 100 python/ dashboard/ transport/ tests/python/

      - name: Flake8 lint
        run: flake8 python/ dashboard/ transport/ tests/python/

      - name: Pytest
        run: pytest tests/python/ -v --tb=short
