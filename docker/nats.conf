# nats.conf — broker config for the perception transport layer.
# Loaded inside the container via docker/docker-compose.yml volume mount.

# Bump default 1 MB → 16 MB so the BEVGrid (1000×1000 dense floats × multiple
# fields ≈ 4 MB per message) fits comfortably. Localhost transport — this is
# not a substitute for proper flow control on a networked deployment.
max_payload: 16MB

# JetStream for durable streams (telemetry/safety subjects later). Ephemeral
# pub/sub on perception.> doesn't need this, but enabling it costs nothing
# until you declare a stream.
jetstream {
    store_dir: "/data/jetstream"
}
