version: "3.8"

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    command: ["--jetstream"]

  perception:
    build:
      context: ..
      dockerfile: docker/Dockerfile.perception
    depends_on:
      - nats
    volumes:
      - ../config:/ws/config:ro
    network_mode: host

  ml-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    depends_on:
      - nats
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    network_mode: host

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    depends_on:
      - nats
    ports:
      - "8501:8501"

  # Optional: ROS2 adapter for RViz/Nav2 visualization
