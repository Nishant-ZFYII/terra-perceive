# Phase 1 — standalone perception pipeline.
# Phase 2 services (nats, ml-inference, dashboard) are commented out below.
#
# Usage:
#   docker-compose up              # run smoke test, outputs in ./output/
#   docker-compose run perception bash scripts/run_pipeline.sh  # full pipeline

services:
  perception:
    build:
      context: ..
      dockerfile: docker/Dockerfile.perception
    volumes:
      - ../output:/ws/src/construction_perception/output
    # Phase 2 services
    depends_on:
      - nats

  # --- Cartographer SLAM (P2-M1.3) ---
  # Only runs when explicitly invoked with --profile cartographer
  cartographer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cartographer
    profiles:
      - cartographer
    volumes:
      - ../data/RELLIS-3D:/data
      - ../data:/output
    network_mode: host

  # --- Phase 2 ---
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    # max_payload (16 MB, vs default 1 MB) is set in nats.conf, not CLI —
    # the server only accepts it via config file. JetStream on for future
    # durable subjects.
    command: ["-c", "/etc/nats/nats.conf"]
