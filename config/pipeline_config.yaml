# pipeline_config.yaml — Central configuration for perception pipeline.
# All tunable parameters in one place. No magic numbers in code.
# Phase 1: sector RANSAC, vehicle-aware traversability, kinematic safety.

active_vehicle: warthog 

# --- Vehicle kinematics (drum roller / heavy equipment) ---
vehicle_drum_roller:
  mass_kg: 30000.0           # 30-ton drum roller
  max_speed_mps: 2.0         # max operating speed
  max_climbable_grade_deg: 20.0
  max_roughness_tolerance: 0.15   # meters RMS
  max_step_height: 0.3       # meters

vehicle_warthog: #https://clearpathrobotics.com/warthog-unmanned-ground-vehicle-robot/
  mass_kg: 590.0            # Warthog weight
  max_speed_mps: 5.0         # max operating speed
  max_climbable_grade_deg: 30.0 #estimated, not on datasheet
  max_roughness_tolerance: 0.275    # meters RMS
  max_step_height: 0.2       # meters

# --- RANSAC ground segmentation ---
ransac:
  distance_threshold: 0.15   # meters — inlier/outlier boundary
  max_iterations: 1000
  confidence: 0.99
  min_inliers: 100

# --- Sector parameters (Phase 1 upgrade) ---
sector:
  sector_size_x: 5.0         # meters per sector
  sector_size_y: 5.0
  continuity_angle_thresh_deg: 30.0  # max normal disagreement between neighbors

# --- Traversability grid ---
traversability:
  resolution: 0.5            # meters per cell
  x_min: -5.0
  x_max: 30.0
  y_min: -15.0
  y_max: 15.0
  min_points_per_cell: 3

  # P2-M6: confidence-mode toggle and LiDAR noise model.
  # heuristic     -> legacy P1-M3 formula (count_factor * range_factor).
  # probabilistic -> noise-aware confidence (sigma(r) -> PCA -> calibrated [0,1]).
  # See docs/m12-probabilistic-traversability.md and notes/m6_math_sketch.md.
  confidence_mode: heuristic   # heuristic | probabilistic
  lidar_sigma_0: 0.01          # Ouster OS1-64 near-range noise floor (m)
  lidar_sigma_k: 0.0001        # quadratic-in-range coefficient (m / m^2)

# --- Kinematic safety supervisor ---
safety:
  # Stopping distance model
  reaction_time_s: 0.2       # sensor-to-actuator latency
  gravity: 9.81

  # Friction model: mu = mu_base + mu_trav_scale * traversability_score
  mu_base: 0.3               # worst-case friction (slippery mud)
  mu_trav_scale: 0.5         # additional friction for good terrain

  # TTC intervention thresholds
  ttc_emergency_stop: 0.0    # TTC <= 0 -> e-stop
  ttc_hard_brake: 2.0        # TTC < 2s -> hard brake (10% velocity)
  ttc_proportional: 5.0      # TTC < 5s -> proportional scaling

  # Sensor health
  lidar_timeout_ms: 200.0
  loop_rate_hz: 50
  loop_warn_ms: 20.0

  # P2-M6: Control Barrier Function clamp on commanded acceleration.
  # kinematic -> legacy step-function intervention.
  # cbf       -> 1D scalar CBF clamp (a_cmd <= (gamma*h - v_relative)/A).
  # See docs/m13-cbf-safety.md and notes/m6_math_sketch.md §2.
  safety_mode: kinematic       # kinematic | cbf
  cbf_gamma: 1.0               # CBF class-K gain (alpha(h) = gamma*h)
  cbf_d_safe_min: 0.5          # minimum allowed margin beyond d_stop (m)

# --- Camera-LiDAR projection ---
# See config/camera_lidar_calib.yaml for extrinsic/intrinsic matrices

# --- Semantic class to traversability modifier (for fusion) ---
semantic_modifiers:
  grass: 1.0
  dirt: 0.9
  gravel: 0.8
  asphalt: 1.0
  mud: 0.5
  water: 0.1
  tree: 0.0
  bush: 0.3
  fence: 0.0
  building: 0.0
  person: 0.0
  vehicle: 0.0
  unknown: 0.6

# --- P2-M4 tracker (SORT) ---
# Defaults consumed by tracker_runner unless overridden by CLI flags.
# Solver: greedy is O(N*M) and order-dependent on ambiguous costs;
#         munkres is O(N^3) and globally optimal. Default to greedy
#         (fast, fine for sparse scenes); flip to munkres when scenes
#         get dense or for ablation A.
tracker:
  solver: greedy           # greedy | munkres
  max_dist: 3.0            # gating threshold in measurement units (m)
  max_misses: 3            # consecutive misses before track is pruned
  min_hits: 1              # consecutive hits before a track is publishable
  dt: 0.1                  # seconds between frames
  process_noise: 0.01      # KF Q diagonal (isotropic)
  meas_noise: 0.1          # KF R diagonal (isotropic)
  snapshot_every: 1        # 1 = per-frame snapshots; raise for scalar-only runs

# --- DBSCAN for obstacle clustering (consumed by cluster_obstacles.py / M4.5) ---
dbscan:
  eps: 0.5                 # neighborhood radius in meters
  min_points: 10           # minimum core-point density
