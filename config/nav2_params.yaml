# nav2_params.yaml — Nav2 configuration for construction perception demo.
# PDF reference: Part 8

# TODO: Configure after implementing costmap layer plugin.
# Key sections:
#   - local_costmap: add traversability_layer + obstacle_layer
#   - controller_server: MPPI with max_vel 2.0 m/s (heavy equipment)
#   - planner_server: SmacPlannerHybrid or NavfnPlanner

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.5
      plugins: ["traversability_layer", "obstacle_layer", "inflation_layer"]
      traversability_layer:
        plugin: "construction_perception::TraversabilityCostmapLayer"
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      vx_max: 2.0
      vy_max: 0.0
      wz_max: 1.0
